version: 2

project_name: bl

builds:
  - id: bl
    dir: scripts
    main: ./cmd/bl
    binary: bl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: bl
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - SKILL.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
